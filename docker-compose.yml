services:
  dawakhana:
    build: .
    container_name: dawakhana
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-32-bytes-minimum}
      JWT_EXPIRES_IN: 7d
      DB_PATH: /app/data/pharmacy.db
    volumes:
      - dawakhana-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dawakhana-data:
