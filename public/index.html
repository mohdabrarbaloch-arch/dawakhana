<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dawakhana — Smart Pharmacy Management System for Pakistani pharmacies. Inventory, expiry tracking, credit ledger (khata) and daily reports."
    />
    <title>Dawakhana — Pharmacy Manager</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0f14;
        --bg-2: #0f1620;
        --card: #131c27;
        --card-2: #182334;
        --border: #223043;
        --text: #e8eef4;
        --muted: #8fa3b8;
        --accent: #2dd4bf;
        --accent-2: #14b8a6;
        --gold: #d4af37;
        --red: #f87171;
        --amber: #fbbf24;
        --green: #4ade80;
        --radius: 14px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 80% -10%, #123c3a 0%, transparent 55%),
          radial-gradient(900px 500px at -10% 110%, #1a2740 0%, transparent 55%), var(--bg);
        color: var(--text);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .hidden {
        display: none !important;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      input,
      select,
      textarea {
        font-family: inherit;
      }

      /* ── Auth screen ──────────────────────────────── */
      #auth-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 36px 32px;
        box-shadow: var(--shadow);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .brand .logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), #0d9488);
        font-size: 22px;
      }
      .brand h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 22px;
        letter-spacing: 0.5px;
      }
      .brand small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .tabs {
        display: flex;
        background: var(--bg-2);
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 22px;
      }
      .tabs button {
        flex: 1;
        background: none;
        border: none;
        color: var(--muted);
        font-weight: 600;
        padding: 10px;
        border-radius: 8px;
        transition: 0.2s;
      }
      .tabs button.active {
        background: var(--card-2);
        color: var(--text);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
        font-weight: 500;
      }
      .field input {
        width: 100%;
        background: var(--bg-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: border 0.2s;
      }
      .field input:focus {
        border-color: var(--accent);
      }
      .btn {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #04211d;
        border: none;
        padding: 13px 20px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 15px;
        width: 100%;
        transition:
          transform 0.1s,
          filter 0.2s;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.secondary {
        background: var(--card-2);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn.small {
        width: auto;
        padding: 8px 14px;
        font-size: 13px;
        border-radius: 8px;
      }
      .btn.danger {
        background: transparent;
        color: var(--red);
        border: 1px solid #7f1d1d;
      }
      .error-msg {
        color: var(--red);
        font-size: 13px;
        margin-top: 12px;
        min-height: 18px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin-top: 18px;
        text-align: center;
        line-height: 1.6;
      }

      /* ── App shell ───────────────────────────────── */
      #app {
        display: none;
        min-height: 100vh;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 20px;
        background: rgba(10, 15, 20, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }
      .topbar .brand {
        margin: 0;
      }
      .topbar .spacer {
        flex: 1;
      }
      .user-chip {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #0d9488);
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #04211d;
        font-size: 14px;
      }
      .user-chip .meta {
        line-height: 1.2;
      }
      .user-chip .meta b {
        font-size: 13px;
        display: block;
      }
      .user-chip .meta span {
        font-size: 11px;
        color: var(--muted);
        text-transform: capitalize;
      }
      .nav {
        display: flex;
        gap: 6px;
        padding: 10px 20px;
        overflow-x: auto;
        background: var(--bg-2);
        border-bottom: 1px solid var(--border);
        scrollbar-width: none;
      }
      .nav::-webkit-scrollbar {
        display: none;
      }
      .nav button {
        background: none;
        border: none;
        color: var(--muted);
        font-weight: 600;
        font-size: 14px;
        padding: 9px 16px;
        border-radius: 999px;
        white-space: nowrap;
        transition: 0.2s;
      }
      .nav button.active {
        background: var(--card-2);
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--border);
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 22px 20px 80px;
      }

      /* ── Dashboard cards ────────────────────────── */
      .stats {
        display: grid;
        grid-template-columns: repeat_auto-fit, minmax(160px, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        position: relative;
        overflow: hidden;
      }
      .stat::after {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 3px;
        background: linear-gradient(90deg, var(--accent), transparent);
      }
      .stat .label {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .stat .value {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 26px;
        font-weight: 700;
        margin-top: 6px;
      }
      .stat .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .stat.gold::after {
        background: linear-gradient(90deg, var(--gold), transparent);
      }
      .stat.red::after {
        background: linear-gradient(90deg, var(--red), transparent);
      }
      .stat.amber::after {
        background: linear-gradient(90deg, var(--amber), transparent);
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 20px;
      }
      .panel h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 17px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .panel h2 .count {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        font-family: 'Inter';
        font-weight: 500;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
        align-items: center;
      }
      .toolbar input,
      .toolbar select {
        background: var(--bg-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 9px 12px;
        border-radius: 9px;
        font-size: 14px;
        outline: none;
      }
      .toolbar input:focus,
      .toolbar select:focus {
        border-color: var(--accent);
      }
      .toolbar .grow {
        flex: 1;
        min-width: 160px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th {
        text-align: left;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 10px;
        border-bottom: 1px solid #1a2533;
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }
      .table-wrap {
        overflow-x: auto;
      }

      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }
      .badge.green {
        background: rgba(74, 222, 128, 0.12);
        color: var(--green);
      }
      .badge.red {
        background: rgba(248, 113, 113, 0.12);
        color: var(--red);
      }
      .badge.amber {
        background: rgba(251, 191, 36, 0.12);
        color: var(--amber);
      }
      .badge.gold {
        background: rgba(212, 175, 55, 0.12);
        color: var(--gold);
      }
      .badge.slate {
        background: rgba(143, 163, 184, 0.12);
        color: var(--muted);
      }
      .badge.teal {
        background: rgba(45, 212, 191, 0.12);
        color: var(--accent);
      }

      .row-actions {
        display: flex;
        gap: 6px;
      }
      .icon-btn {
        background: var(--bg-2);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 8px;
        padding: 6px 9px;
        font-size: 12px;
        font-weight: 600;
        transition: 0.15s;
      }
      .icon-btn:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .icon-btn.danger:hover {
        color: var(--red);
        border-color: var(--red);
      }

      /* ── Modal ────────────────────────────────────── */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(4, 8, 12, 0.7);
        backdrop-filter: blur(4px);
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 50;
      }
      .modal {
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        overflow-y: auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 26px;
        box-shadow: var(--shadow);
      }
      .modal h3 {
        font-family: 'Space Grotesk', sans-serif;
        margin-bottom: 18px;
        font-size: 18px;
      }
      .modal .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .modal .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .modal .actions .btn {
        flex: 1;
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--card-2);
        border: 1px solid var(--accent);
        color: var(--text);
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
        box-shadow: var(--shadow);
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .toast.error {
        border-color: var(--red);
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 36px 0;
        font-size: 14px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .price {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
      }
      .flex {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .alert-banner {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 16px;
        font-size: 14px;
        font-weight: 600;
      }
      .alert-banner.warn {
        background: rgba(251, 191, 36, 0.08);
        border: 1px solid rgba(251, 191, 36, 0.3);
        color: var(--amber);
      }
      .alert-banner.crit {
        background: rgba(248, 113, 113, 0.08);
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: var(--red);
      }
      @media (max-width: 640px) {
        .modal .row {
          grid-template-columns: 1fr;
        }
        .topbar {
          padding: 12px 14px;
        }
        .user-chip .meta {
          display: none;
        }
        .stat .value {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Auth screen -->
    <div id="auth-screen">
      <div class="auth-card">
        <div class="brand">
          <div class="logo">💊</div>
          <div>
            <h1>Dawakhana</h1>
            <small>Smart Pharmacy Manager</small>
          </div>
        </div>
        <div class="tabs">
          <button id="tab-login" class="active" onclick="switchTab('login')">Login</button>
          <button id="tab-register" onclick="switchTab('reggister')">Register</button>
        </div>
        <form id="login-form">
          <div class="field">
            <label>Email</label>
            ><input id="login-email" type="email" placeholder="owner@dawakhana.pk" required />
          </div>
          <div class="field">
            <label>Password</label>
            ><input id="login-pass" type="password" placeholder="••••••••" required />
          </div>
          <button class="btn" type="submit">Sign in →</button>
          <div class="error-msg" id="login-error"></div>
        </form>
        <form id="reggister-form" class="hidden">
          <div class="field">
            <label>Full name</label>
            ><input id="reg-name" type="text" placeholder="Store Owner" required />
          </div>
          <div class="field">
            <label>Email</label>
            ><input id="reg-email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label>Password (min 8 chars)</label>
            ><input id="reg-pass" type="password" placeholder=".††††††††" minlength="8" required />
          </div>
          <button class="btn" type="submit">Create account →</button>
          <div class="error-msg" id="register-error"></div>
        </form>
        <p class="hint">
          Inventory with expiry alerts · Credit khata ledger · Daily reports<br />Works on any phone
          — no app install needed.
        </p>
      </div>
    </div>

    <!-- App shell -->
    <div id="app">
      <div class="topbar">
        <div class="brand">
          <div class="logo">💊</div>
          <div>
            <h1>Dawakhana</h1>
            <small>Pharmacy Manager</small>
          </div>
        </div>
        <div class="spacer"></div>
        <div class="user-chip">
          <div class="meta"><b id="user-name">—</b><span id="user-role">—</span></div>
          <div class="avatar" id="user-avatar">?</div>
          <button class="icon-btn" onclick="logout()" title="Logout">Logout</button>
        </div>
      </div>
      <div class="nav">
        <button id="nav-dashboard" class="active" onclick="showView('dashboard')">
          📊 Dashboard
        </button>
        <button id="nav-products" onclick="showView('products')">💊 Products</button>
        <button id="nav-sales" onclick="showView('sales')">🧾 Sales</button>
        <button id="nav-customers" onclick="showView('customers')">👥 Khata</button>
        <button id="nav-reports" onclick="showView('reports')">📈 Reports</button>
      </div>
      <main>
        <div id="view-dashboard"></div>
        <div id="view-products" class="hidden"></div>
        <div id="view-sales" class="hidden"></div>
        <div id="view-customers" class="hidden"></div>
        <div id="view-reports" class="hidden"></div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
